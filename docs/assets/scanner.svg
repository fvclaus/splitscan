<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">Use your scanner. Keep processing local.</title>
  <desc id="desc">Flatbed scanner with four prints. SplitScan preserves the original scan and does not upload photographs.</desc>
  <rect width="1000" height="280" rx="16" fill="#e8f0e8"/>
  <g transform="translate(55 40)">
    <rect x="10" width="260" height="170" rx="12" fill="#b3c3bd"/>
    <rect x="25" y="14" width="230" height="140" fill="#dae5df"/>
    <rect x="41" y="28" width="199" height="111" fill="#fff"/>
    <g fill="#a7bcb3">
      <rect x="51" y="40" width="83" height="37"/>
      <rect x="147" y="40" width="83" height="37"/>
      <rect x="51" y="90" width="83" height="37"/>
      <rect x="147" y="90" width="83" height="37"/>
    </g>
    <rect y="155" width="280" height="38" rx="6" fill="#486258"/>
    <circle cx="260" cy="172" r="4" fill="#88d6b1"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#263f35">
    <text x="390" y="72" font-size="12" fill="#286b58" letter-spacing="1.5">SCANNER INPUT / LOCAL PHOTO PROCESSING</text>
    <text x="390" y="120" font-size="32">Use your scanner.</text>
    <text x="390" y="159" font-size="32">Keep processing local.</text>
    <text x="390" y="202" font-size="15" fill="#69716c">No photo uploads. Your original scan stays intact.</text>
    <text x="390" y="231" font-size="13" fill="#69716c">Optional sanitized crash reporting is separate and off by default.</text>
  </g>
</svg>
