<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">SplitScan: Scan a page. Split it into photos.</title>
  <desc id="desc">A sage-green banner showing a scanned page separated into four individual photographs.</desc>
  <rect width="1200" height="410" rx="20" fill="#eef3ef"/>
  <g fill="#286b58">
    <rect x="48" y="42" width="38" height="38" rx="9"/>
    <path d="M58 53h7m-7 0v7m19-7h-7m7 0v7m-19 9h7m-7 0v-5m19 5h-7m7 0v-5" fill="none" stroke="#fff" stroke-width="2"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#263f35">
    <text x="100" y="70" font-size="28">SplitScan</text>
    <text x="48" y="130" font-size="13" fill="#286b58" letter-spacing="2">A LOCAL TOOL FOR SCANNED PHOTO BATCHES</text>
    <text x="48" y="193" font-size="48">Scan a page.</text>
    <text x="48" y="250" font-size="48">Split it into photos.</text>
    <text x="48" y="306" font-size="18" fill="#69716c">Detect. Review. Adjust. Export.</text>
    <text x="48" y="349" font-size="15" fill="#286b58">All processing happens on device</text>
  </g>
  <g transform="translate(610 80)">
    <rect width="235" height="254" rx="12" fill="#fff" stroke="#dde2dd"/>
    <g stroke="#fff" stroke-width="6">
      <rect x="20" y="22" width="90" height="94" fill="#a7bcb3"/>
      <rect x="125" y="22" width="90" height="94" fill="#b5cad8"/>
      <rect x="20" y="133" width="90" height="94" fill="#deceb2"/>
      <rect x="125" y="133" width="90" height="94" fill="#cec0d7"/>
    </g>
    <path d="M257 125h36m-12-10 12 10-12 10" fill="none" stroke="#286b58" stroke-width="3"/>
    <g transform="translate(319 0)" stroke="#fff" stroke-width="7">
      <rect width="85" height="100" rx="4" fill="#a7bcb3"/>
      <rect x="100" width="85" height="100" rx="4" fill="#b5cad8"/>
      <rect y="140" width="85" height="100" rx="4" fill="#deceb2"/>
      <rect x="100" y="140" width="85" height="100" rx="4" fill="#cec0d7"/>
    </g>
  </g>
</svg>
