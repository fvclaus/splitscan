name: Native build, tests, and release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_version:
        description: "Validated MAJOR.MINOR.PATCH candidate; this run never publishes"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  native-build:
    name: ${{ matrix.target }} tests and frozen smoke
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
          - target: macos-x64
            runner: macos-15-intel
          - target: macos-arm64
            runner: macos-15
          - target: linux-x64
            runner: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"

      - name: Resolve and validate application version
        id: version
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python tools/release.py resolve --tag "$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            python tools/release.py resolve --candidate "$CANDIDATE_VERSION"
          else
            python tools/release.py resolve --run-number "$GITHUB_RUN_NUMBER"
          fi

      - name: Install pinned build and application dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          python -m pip install --disable-pip-version-check -e ".[test]"

      - name: Run test suite
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest

      - name: Build, audit, and smoke-test native application
        shell: bash
        run: python tools/package.py --version "$SPLITSCAN_VERSION" --target "${{ matrix.target }}"

      - name: Upload native archive and checksum
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e0d76 # v4.3.6
        with:
          name: native-${{ matrix.target }}
          path: |
            build/artifacts/splitscan-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip
            build/artifacts/splitscan-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  corresponding-source:
    name: Version-matched source materials
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"

      - name: Resolve and validate source version
        id: version
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python tools/release.py resolve --tag "$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            python tools/release.py resolve --candidate "$CANDIDATE_VERSION"
          else
            python tools/release.py resolve --run-number "$GITHUB_RUN_NUMBER"
          fi

      - name: Install pinned runtime and source tooling
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.txt
          python -m pip install --disable-pip-version-check .

      - name: Download, verify, and assemble official source materials
        shell: bash
        run: python tools/download_sources.py "$SPLITSCAN_VERSION"

      - name: Upload corresponding-source archive
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e0d76 # v4.3.6
        with:
          name: corresponding-source
          path: build/splitscan-v${{ steps.version.outputs.version }}-corresponding-source.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  validate-release:
    name: Verify complete release candidate
    needs:
      - native-build
      - corresponding-source
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"

      - name: Resolve release candidate version
        id: version
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python tools/release.py resolve --tag "$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            python tools/release.py resolve --candidate "$CANDIDATE_VERSION"
          else
            python tools/release.py resolve --run-number "$GITHUB_RUN_NUMBER"
          fi

      - name: Download native and corresponding-source assets
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: native-*
          merge-multiple: true
          path: build/release

      - name: Download source archive
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: corresponding-source
          path: build/release

      - name: Verify release archives, checksums, manifests, notices, and sources
        shell: bash
        run: python tools/verify_release_artifacts.py --directory build/release --version "$SPLITSCAN_VERSION"

      - name: Upload verified release candidate
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e0d76 # v4.3.6
        with:
          name: verified-release
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate-release
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download verified assets
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: verified-release
          path: build/release

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" build/release/*.zip build/release/*.sha256 \
            --verify-tag \
            --title "SplitScan ${GITHUB_REF_NAME#v}" \
            --generate-notes
