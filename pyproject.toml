[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-splitter"
description = "A local desktop app for splitting flatbed scans into individual photos."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "docs/THIRD_PARTY_NOTICES.md", "docs/licenses/*.txt"]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.6",
    "opencv-python-headless==4.11.0.86",
    "PySide6-Essentials==6.8.3",
    "sentry-sdk==2.35.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
photo-splitter = "photo_splitter.app:main"

[tool.setuptools.dynamic]
version = {attr = "photo_splitter.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photo_splitter = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
