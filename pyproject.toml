[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-splitter"
version = "0.1.0"
description = "A local desktop app for splitting flatbed scans into individual photos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "PySide6>=6.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
photo-splitter = "photo_splitter.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
photo_splitter = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
